name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pgos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pgos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGOS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pgos_test
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - name: Check tag version
        run: |
          package_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "postgreos") | .version')
          test "v${package_version}" = "${GITHUB_REF_NAME}"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  binaries:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: docker build --target runtime --tag postgreos-release .
      - name: Create archive
        run: |
          archive="postgreos-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu"
          mkdir "${archive}"
          container=$(docker create postgreos-release)
          docker cp "${container}:/usr/local/bin/pgos" "${archive}/pgos"
          docker cp "${container}:/usr/local/bin/pgosd" "${archive}/pgosd"
          docker cp "${container}:/usr/local/bin/pgos-mount" "${archive}/pgos-mount"
          docker rm "${container}"
          cp README.md LICENSE "${archive}/"
          tar -czf "${archive}.tar.gz" "${archive}"
          sha256sum "${archive}.tar.gz" > "${archive}.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            postgreos-*.tar.gz
            postgreos-*.tar.gz.sha256

  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/statespace-tech/postgreos
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          target: runtime
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  crates:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Check crates.io token
        run: test -n "${CARGO_REGISTRY_TOKEN}"
      - name: Publish crates
        run: cargo publish --locked
