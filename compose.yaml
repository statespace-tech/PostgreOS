services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: postgreos
      POSTGRES_PASSWORD: postgreos
      POSTGRES_USER: postgreos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgreos -d postgreos"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  postgreos:
    image: ghcr.io/statespace-tech/postgreos:0.1.0
    environment:
      PGOS_DATABASE_URL: postgresql://postgreos:postgreos@postgres:5432/postgreos
      PGOS_VOLUME: development
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sleep", "infinity"]

volumes:
  postgres-data:
